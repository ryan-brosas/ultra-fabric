name: Publish npm prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: >-
          node -e "const { version } = require('./package.json'); const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Expected tag ' + expected + ', received ' + process.env.GITHUB_REF_NAME)"
      - name: Publish prerelease
        run: npm publish --access public --tag next
      - name: Build release notes
        run: >-
          node scripts/release-notes.mjs
          --version "${GITHUB_REF_NAME#v}"
          --out "$RUNNER_TEMP/release"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          TAG="$GITHUB_REF_NAME";
          TITLE_FILE="$RUNNER_TEMP/release/release-title.txt";
          BODY_FILE="$RUNNER_TEMP/release/release-body.md";
          PREV_FILE="$RUNNER_TEMP/release/release-prev.txt";
          PREV="$(cat "$PREV_FILE")";
          if [ -n "$PREV" ]; then
            gh api "repos/${{ github.repository }}/compare/$PREV...$TAG" \
              --jq '.commits[].commit.message | split("\n")[0]' | sed 's/^/- /' \
              | { printf '\n## Commits\n\n'; cat; } >> "$BODY_FILE";
          fi;
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "$(cat "$TITLE_FILE")" --notes-file "$BODY_FILE" \
            || gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "$(cat "$TITLE_FILE")" --notes-file "$BODY_FILE"
