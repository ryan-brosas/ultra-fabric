name: Publish npm prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: >-
          node -e "const { version } = require('./package.json'); const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Expected tag ' + expected + ', received ' + process.env.GITHUB_REF_NAME)"
      - name: Publish prerelease
        run: npm publish --access public --tag next
